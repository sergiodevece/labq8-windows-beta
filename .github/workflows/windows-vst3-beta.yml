# LABQ8 private Windows x64 VST3 beta. Branch distribution/windows-vst3-e4d:
# E4d (17c9c32) for the owner's own Windows smoke (Intel laptop).
# Same scheme as Gainer80's workflow (windows-2022, VS 2022 x64, JUCE 9.0.3
# pinned), with the validations of HARMOHIT MASTER R2. Started by hand only.
# Private repository; the artefact is not a Release.
name: LABQ8 Windows VST3 x64 beta (private)

on:
  workflow_dispatch:
    inputs:
      diagnose_tests:
        description: 'Only build the tests and run each of the 229 in its own process'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: labq8-windows-beta
  cancel-in-progress: false

jobs:
  windows-vst3-beta:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Keep Git blob bytes (no CRLF conversion)
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the product is the approved E4d tree and pin JUCE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path validation -Force | Out-Null
          # Snapshot of 17c9c32ea41b4bd2b200966d926d9eb00fa50304 (tree 019292f6...).
          $snapshot = '45f7ebbf3af2f787be898d4a983e1f913b11bce2'
          if ((git rev-parse "$snapshot^{tree}").Trim() -ne '019292f69977ea4f8dcb66d3180ccec2315c28c4') { throw 'Snapshot tree mismatch' }
          git diff --exit-code $snapshot HEAD -- . ':(exclude)distribution' ':(exclude).github'
          if ($LASTEXITCODE -ne 0) { throw 'Product files differ from the approved E4d commit' }
          git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git external/JUCE
          if ($LASTEXITCODE -ne 0) { throw 'JUCE checkout failed' }
          if ((git -C external/JUCE rev-parse HEAD).Trim() -ne 'be29c81492b6151c8ea8d14c840e1311963b3a83') { throw 'JUCE pin mismatch' }
          "Product tree 019292f69977ea4f8dcb66d3180ccec2315c28c4 = LABQ8 17c9c32ea41b4bd2b200966d926d9eb00fa50304; built revision $env:GITHUB_SHA; JUCE be29c81492b6151c8ea8d14c840e1311963b3a83" | Set-Content validation/revision.txt

      - name: Configure Visual Studio 2022 Release x64
        shell: pwsh
        run: |
          cmake -S . -B build/windows-x64 -G "Visual Studio 17 2022" -A x64 -DLABQ8_BUILD_TESTS=ON "-DCMAKE_PROJECT_INCLUDE=${{ github.workspace }}/distribution/windows/windows-build-overrides.cmake" 2>&1 | Tee-Object validation/configure.txt
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }

      - name: Build the VST3, the tests and the capture tool
        shell: pwsh
        run: |
          $targets = if ('${{ inputs.diagnose_tests }}' -eq 'true') { @('labq8_tests') } else { @('LABQ8_VST3', 'labq8_tests', 'labq8_ui_snapshot') }
          cmake --build build/windows-x64 --config Release --parallel 4 --target $targets 2>&1 | Tee-Object validation/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build failed; no product-source change is authorised' }

      - name: Run each test in its own process (diagnosis)
        if: ${{ inputs.diagnose_tests }}
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path build/windows-x64 -Recurse -File -Filter 'labq8_tests.exe' | Select-Object -First 1
          $names = Get-Content distribution/windows/test-names.txt
          $summary = @()
          New-Item -ItemType Directory -Path validation/tests-each -Force | Out-Null
          $i = 0
          foreach ($name in $names) {
            $i++
            $out = & $tests.FullName $name 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out | Set-Content ("validation/tests-each/{0:D3}.txt" -f $i)
            $summary += ('{0:D3} exit {1} :: {2}' -f $i, $code, $name)
          }
          $summary | Set-Content validation/tests-each-summary.txt
          ($summary | Where-Object { $_ -notmatch ' exit 0 ::' }) | Set-Content validation/tests-each-failures.txt
          exit 0

      - name: Run the 229 tests (results recorded, packaging continues)
        if: ${{ ! inputs.diagnose_tests }}
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path build/windows-x64 -Recurse -File -Filter 'labq8_tests.exe' | Select-Object -First 1
          & $tests.FullName 2>&1 | Tee-Object validation/tests.txt
          "exit code $LASTEXITCODE" | Add-Content validation/tests.txt
          exit 0

      - name: Load the real bundle in a JUCE VST3 test host (not Pro Tools / PatchWork)
        if: ${{ ! inputs.diagnose_tests }}
        shell: pwsh
        run: |
          cmake -S distribution/windows/vst3-smoke -B build/vst3-smoke -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="${{ github.workspace }}/external/JUCE" 2>&1 | Out-File validation/vst3-smoke-build.txt
          cmake --build build/vst3-smoke --config Release --parallel 4 2>&1 | Out-File -Append validation/vst3-smoke-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'VST3 test host build failed' }
          $bundle = Get-ChildItem -Path build/windows-x64 -Recurse -Directory -Filter 'LABQ8.vst3' | Select-Object -First 1
          $smoke = Get-ChildItem -Path build/vst3-smoke -Recurse -File -Filter 'labq8_vst3_smoke.exe' | Select-Object -First 1
          & $smoke.FullName $bundle.FullName "${{ github.workspace }}/validation/Windows-VST3-editor.png" 2>&1 | Tee-Object validation/vst3-smoke.txt
          "exit code $LASTEXITCODE" | Add-Content validation/vst3-smoke.txt
          exit 0

      - name: Windows captures (UI-2c views, E4d STEREO / MID / SIDE) and the font study
        if: ${{ ! inputs.diagnose_tests }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem -Path build/windows-x64 -Recurse -File -Filter 'labq8_ui_snapshot.exe' | Select-Object -First 1
          & $tool.FullName --fonts unused 2>&1 | Tee-Object validation/fonts-juce.txt
          & $tool.FullName docs/design/LABQ8_UI_DESIGN_APPROVED_01.png validation/ui2c-captures --ui2c 2>&1 | Tee-Object validation/ui2c-captures.txt
          & $tool.FullName docs/design/LABQ8_UI_DESIGN_APPROVED_01.png validation/e4d-captures --e4d 2>&1 | Tee-Object validation/e4d-captures.txt
          Add-Type -AssemblyName System.Drawing
          $families = (New-Object System.Drawing.Text.InstalledFontCollection).Families | ForEach-Object Name
          "Installed families matching Helvetica / DIN:" | Set-Content validation/fonts-installed.txt
          ($families | Where-Object { $_ -match 'Helvetica|DIN' }) | Add-Content validation/fonts-installed.txt
          "Total families: $($families.Count)" | Add-Content validation/fonts-installed.txt
          exit 0

      - name: Inspect the binary (PE32+ x64, dependencies, hashes)
        if: ${{ ! inputs.diagnose_tests }}
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build/windows-x64 -Recurse -Directory -Filter 'LABQ8.vst3' | Select-Object -First 1
          $binary = Get-ChildItem -Path (Join-Path $bundle.FullName 'Contents/x86_64-win') -File -Filter '*.vst3' | Select-Object -First 1
          if ($null -eq $binary) { throw 'No x64 binary in the bundle' }
          $b = [IO.File]::ReadAllBytes($binary.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $report = @()
          $report += "MZ: $([char]$b[0])$([char]$b[1])"
          $report += ('PE signature: 0x{0:X8}' -f [BitConverter]::ToUInt32($b, $pe))
          $report += ('Machine: 0x{0:X4} (0x8664 = x64)' -f [BitConverter]::ToUInt16($b, $pe + 4))
          $report += ('Optional header magic: 0x{0:X3} (0x20B = PE32+)' -f [BitConverter]::ToUInt16($b, $pe + 24))
          $report | Set-Content validation/binary-validation.txt
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A -or [BitConverter]::ToUInt32($b, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($b, $pe + 4) -ne 0x8664 -or [BitConverter]::ToUInt16($b, $pe + 24) -ne 0x20B) { throw 'Not a PE32+ x64 image' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          & $dumpbin.FullName /NOLOGO /DEPENDENTS $binary.FullName | Out-File validation/runtime-dependents.txt
          & $dumpbin.FullName /NOLOGO /HEADERS $binary.FullName | Select-String 'machine|subsystem|DLL characteristics' | Out-File -Append validation/binary-validation.txt
          Get-ChildItem -Path $bundle.FullName -Recurse -File | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($h.Hash.ToLower())  $($_.FullName.Substring($bundle.Parent.FullName.Length + 1).Replace('\','/'))"
          } | Set-Content validation/bundle-sha256.txt
          New-Item -ItemType Directory -Path artefact -Force | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination artefact/ -Recurse

      - name: Upload the bundle and the evidence (private artefact, not a Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LABQ8-Windows-x64-VST3-E4d
          path: |
            artefact/
            validation/
          if-no-files-found: warn
          retention-days: 14
